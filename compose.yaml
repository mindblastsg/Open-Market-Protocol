name: open-market-protocol

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: omp
      POSTGRES_PASSWORD: omp
      POSTGRES_DB: omp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp -d omp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - omp-postgres:/var/lib/postgresql/data

volumes:
  omp-postgres:
